services:
  db:
    image: postgres:15
    container_name: bluesky-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5

  api:
    build: ./api
    # Changed from expose to ports for better connectivity
    ports:
      - "8000:8000"
    container_name: bluesky-api
    command: gunicorn -b 0.0.0.0:8000 app:app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  scraper:
    build: ./scraper
    image: bluesky-scraper:latest
    container_name: bluesky-scraper
    command: python runner.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # Change expose to ports
    ports:
      - "3000:3000"
    container_name: bluesky-frontend
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
    env_file:
      - ./frontend/.env.local
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: bluesky-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro  # Shared cert storage
      - ./certbot/www:/var/www/certbot:ro   # Shared challenge folder
    depends_on:
      - api
      - frontend

  certbot:
    image: certbot/certbot
    container_name: bluesky-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: bluesky-airflow-scheduler
    restart: always
    env_file:
      - .env
    user: "0:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
      airflow scheduler
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: bluesky-airflow-web
    restart: always
    env_file:
      - .env
    user: "0:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      airflow-scheduler:
        condition: service_started
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow webserver
      "

volumes:
  db_data:
  airflow_logs:
