server {
    listen 80;
    server_name blueskytoxicity.org www.blueskytoxicity.org;

    # Required for Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name blueskytoxicity.org;

    # Proper paths to Let's Encrypt certificates
    ssl_certificate     /etc/letsencrypt/live/blueskytoxicity.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blueskytoxicity.org/privkey.pem;

    location /api/ {
        proxy_pass http://bluesky-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://bluesky-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
 }
